version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: ilia_backend_mongo
    ports:
      - '${MONGO_PORT}:${MONGO_PORT}'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME} 
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD} 

volumes:
  mongodb_data: