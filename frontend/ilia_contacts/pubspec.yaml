name: ilia_contacts
description: "Ilia Contacts is a contact management application built with Flutter."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  dio: ^5.9.1
  flutter_native_splash: ^2.4.7
  go_router: ^17.1.0
  logger: ^2.6.2
  mocktail: ^1.0.4
  pretty_dio_logger: ^1.4.0
  shimmer: ^3.0.0
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/translations/